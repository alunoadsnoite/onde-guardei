name: Publicar APK de teste

on:
  workflow_run:
    workflows: ["Verificações"]
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onde-guardei-apk-teste
          path: apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publicar APK de teste
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv apk/app-release.apk apk/Onde-Guardei-0.2.0-teste.apk
          gh release create v0.2.0-preview.1 apk/Onde-Guardei-0.2.0-teste.apk --verify-tag --prerelease --title 'Onde Guardei? 0.2.0 — versão de teste' --notes 'Terceira versão de teste para Android 7 ou mais recente. Catálogo offline com fotos, locais organizados, busca, histórico de mudanças, rascunho, backup com fotos, limpeza de fotos órfãs e testes automatizados. APK com assinatura de teste; câmera e seletor de arquivos precisam de validação em aparelho físico. Consulte docs/TESTE-NO-CELULAR.md.'
