name: Publicar APK de teste

on:
  workflow_run:
    workflows: ["Verificações"]
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: onde-guardei-apk-teste
          path: apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Ler a versão do aplicativo
        id: version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publicar APK de teste
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOME="Onde-Guardei-${VERSION}.apk"
          mv apk/app-release.apk "apk/${NOME}"
          TAG="v${VERSION}-preview"
          TARGET="${{ github.event.workflow_run.head_sha || github.sha }}"
          if gh release upload "$TAG" "apk/${NOME}" --clobber 2>/dev/null; then
            echo "APK atualizado em ${TAG}"
            exit 0
          fi
          gh release create "$TAG" "apk/${NOME}" --prerelease --target "$TARGET" \
            --title "Onde Guardei? ${VERSION} — versão de teste" \
            --notes "Versão de teste para Android 7 ou mais recente. Catálogo offline com fotos, locais organizados, busca, histórico de mudanças, rascunho, backup com fotos, limpeza de fotos órfãs e testes automatizados. APK com assinatura de teste; câmera e seletor de arquivos precisam de validação em aparelho físico. Consulte docs/TESTE-NO-CELULAR.md."
